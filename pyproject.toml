[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "winrm-mcp"
version = "0.1.0"
description = "A small MCP server for executing PowerShell and CMD commands over WinRM"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
  "mcp[cli]>=1.28,<2",
  "pypsrp>=0.9,<1",
]

[project.optional-dependencies]
kerberos = ["pypsrp[kerberos]>=0.9,<1"]
credssp = ["pypsrp[credssp]>=0.9,<1"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.9"]

[project.scripts]
winrm-mcp = "winrm_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py310"

